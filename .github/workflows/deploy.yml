name: Deploy Course to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & Build
        run: |
          if [ -d "course" ]; then
            cd course
          fi
          npm install
          npm run build
          if [ -d "dist" ] && [ ! -d "../dist" ]; then
            cp -r dist /tmp/pages-dist
          fi

      - name: Prepare Artifact Directory
        run: |
          if [ -d "course/dist" ]; then
            mv course/dist ./_site
          else
            mv dist ./_site
          fi
          touch ./_site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
